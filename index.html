<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<title>Planner</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060304;
  --s1: #0e0608;
  --s2: #200e12;
  --s3: #000000;
  --border: #3a1820;
  --border2: #4d2030;
  --text: #ffffff;
  --text-mid: #aaaaaa;
  --text-dim: #666666;
  --accent: #c0253a;
  --hour-h: 33px;
  --time-w: 46px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* TOPBAR */
.topbar { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg); z-index: 50; gap: 12px; }
.logo { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; flex-shrink: 0; }
.center-nav { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; }
.period-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-mid); min-width: 190px; text-align: center; }
.nav-btn { background: var(--s2); border: 1px solid var(--border); color: var(--text-mid); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.view-toggle { display: flex; background: var(--s2); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; flex-shrink: 0; }
.view-btn { background: none; border: none; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; padding: 5px 12px; cursor: pointer; transition: all 0.15s; text-transform: uppercase; }
.view-btn.active { background: var(--s3); color: var(--accent); }
.btn-today { background: none; border: 1px solid var(--border); color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.05em; flex-shrink: 0; }
.btn-today:hover { border-color: var(--accent); color: var(--accent); }
.btn-new-task { background: var(--accent); color: #080808; border: none; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 7px; cursor: pointer; transition: opacity 0.15s; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.btn-new-task:hover { opacity: 0.85; }

/* BODY */
.body { display: flex; flex: 1; overflow: hidden; }

/* LEGEND */
.legend { width: 210px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--s1); display: flex; flex-direction: column; overflow: hidden; }
.legend-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.legend-tab { flex: 1; background: none; border: none; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 8px 4px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 2px solid transparent; }
.legend-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.legend-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.legend-list::-webkit-scrollbar { width: 3px; }
.legend-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
.task-node { padding: 0 8px; margin-bottom: 2px; }
.task-node-header { display: flex; align-items: center; gap: 7px; padding: 6px; border-radius: 6px; cursor: grab; transition: background 0.12s; user-select: none; }
.task-node-header:hover { background: var(--s2); }
.task-node-header:active { cursor: grabbing; }
.node-ring { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.node-ring-inner { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.4; }
.task-name { font-size: 11px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-toggle { font-size: 9px; color: var(--text-dim); transition: transform 0.2s; }
.task-toggle.open { transform: rotate(90deg); }
.subtask-list { padding-left: 18px; overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
.subtask-list.open { max-height: 600px; }
.subtask-node { display: flex; align-items: center; gap: 7px; padding: 5px 6px; border-radius: 5px; cursor: grab; transition: background 0.12s; user-select: none; }
.subtask-node:hover { background: var(--s2); }
.subtask-node:active { cursor: grabbing; }
.subtask-ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; flex-shrink: 0; }
.subtask-name { font-size: 10px; color: var(--text-mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.add-sub-btn { display: flex; align-items: center; gap: 5px; padding: 4px 6px; border-radius: 5px; cursor: pointer; color: var(--text-dim); font-size: 10px; transition: color 0.12s; margin-top: 1px; }
.add-sub-btn:hover { color: var(--text-mid); }
.legend-footer { padding: 8px; border-top: 1px solid var(--border); flex-shrink: 0; }

/* CALENDAR WRAP */
.calendar-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* WEEKLY */
.cal-head { display: grid; grid-template-columns: var(--time-w) repeat(7, 1fr); border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--s1); }
.cal-head-empty { border-right: 1px solid var(--border); }
.day-header { padding: 6px 4px; text-align: center; border-right: 1px solid var(--border); }
.day-name { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.day-num { font-size: 16px; font-weight: 600; line-height: 1.2; margin-top: 1px; color: var(--text-mid); }
.day-header.today .day-num { color: var(--accent); }
.day-header.today .day-name { color: var(--accent); opacity: 0.7; }
.cal-body { flex: 1; overflow-y: auto; position: relative; }
.cal-body::-webkit-scrollbar { width: 4px; }
.cal-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
.cal-grid { display: grid; grid-template-columns: var(--time-w) repeat(7, 1fr); }
.time-col { position: sticky; left: 0; background: var(--s1); z-index: 10; border-right: 1px solid var(--border); }
.time-slot { height: var(--hour-h); display: flex; align-items: flex-start; justify-content: flex-end; padding: 3px 6px 0 0; border-bottom: 1px solid var(--border); }
.time-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); }
.day-col { border-right: 1px solid var(--border); position: relative; }
.hour-cell { height: var(--hour-h); border-bottom: 1px solid var(--border); position: relative; transition: background 0.1s; }
.hour-cell.drag-over { background: rgba(200,255,87,0.08); }
.hour-cell.drag-over::after { content: attr(data-hour-label); position: absolute; top: 2px; left: 4px; font-size: 9px; font-family: 'JetBrains Mono', monospace; color: var(--accent); pointer-events: none; font-weight: 600; }
.hour-cell.selected { background: rgba(200,255,87,0.11); border: 1px solid rgba(200,255,87,0.3); }
.half-line { position: absolute; top: 50%; left: 0; right: 0; border-top: 1px dashed rgba(255,255,255,0.04); pointer-events: none; }
.block.faded { opacity: 0.9; filter: none; }
.block.faded > * { position: relative; z-index: 1; }
.block.faded::after { content: ''; position: absolute; inset: 0; z-index: 0; background: repeating-linear-gradient(-45deg, rgba(0,0,0,0.22) 0, rgba(0,0,0,0.22) 2px, transparent 2px, transparent 7px), repeating-linear-gradient(45deg, rgba(0,0,0,0.22) 0, rgba(0,0,0,0.22) 2px, transparent 2px, transparent 7px); border-radius: 4px; pointer-events: none; }
.subtask-node.faded-node { opacity: 0.4; filter: grayscale(0.8); }

/* BLOCKS */
.block { position: absolute; left: 2px; right: 2px; border-radius: 5px; padding: 3px 6px; cursor: pointer; overflow: hidden; z-index: 5; border: 1px solid rgba(255,255,255,0.06); transition: opacity 0.15s; }
.block:hover { opacity: 0.85; }
.block.dragging { opacity: 0.25; }
.block-nodes { display: flex; align-items: center; gap: 3px; margin-bottom: 2px; }
.block-outer-node { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.block-inner-node { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.block-title { font-size: 10px; font-weight: 500; line-height: 1.3; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.block-sub { font-size: 9px; opacity: 0.65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.block-dur { font-family: 'JetBrains Mono', monospace; font-size: 8px; opacity: 0.5; margin-top: 1px; }
.now-line { position: absolute; left: 0; right: 0; height: 1px; background: var(--accent); z-index: 8; pointer-events: none; }
.now-line::before { content: ''; position: absolute; left: -3px; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* MONTHLY */
.month-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.month-head { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--s1); }
.month-day-name { padding: 6px 4px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; border-right: 1px solid var(--border); }
.month-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; overflow: hidden; }
.month-cell { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 5px; cursor: pointer; transition: background 0.1s; overflow: hidden; }
.month-cell:hover { background: rgba(255,255,255,0.02); }
.month-cell.today { background: rgba(200,255,87,0.04); }
.month-cell.other-month .mc-num { opacity: 0.22; }
.mc-num { font-size: 11px; font-weight: 500; color: var(--text-mid); margin-bottom: 3px; font-family: 'JetBrains Mono', monospace; }
.month-cell.today .mc-num { color: var(--accent); font-weight: 600; }
.mc-blocks { display: flex; flex-direction: column; gap: 2px; }
.mc-block { border-radius: 3px; padding: 2px 5px; font-size: 9px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.mc-more { font-size: 9px; color: var(--text-dim); padding: 1px 3px; }

/* DRAG GHOST */
.drag-ghost { position: fixed; pointer-events: none; z-index: 999; opacity: 0.88; border-radius: 6px; padding: 5px 10px; font-size: 11px; font-weight: 600; transform: rotate(2deg); box-shadow: 0 8px 24px rgba(0,0,0,0.6); display: none; }

/* SELECT BAR */
.select-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--s3); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 16px; font-size: 11px; color: var(--text-mid); font-family: 'JetBrains Mono', monospace; z-index: 100; display: none; gap: 8px; align-items: center; white-space: nowrap; }
.select-bar.visible { display: flex; }
.select-bar-clear { cursor: pointer; color: var(--accent); margin-left: 8px; }

/* MODALS */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.78); backdrop-filter: blur(6px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.18s; }
.overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--s2); border: 1px solid var(--border2); border-radius: 13px; padding: 22px; width: 100%; max-width: 400px; transform: translateY(10px) scale(0.98); transition: transform 0.18s; }
.overlay.open .modal { transform: translateY(0) scale(1); }
.modal-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
.fg { margin-bottom: 11px; }
.flabel { display: block; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
.finput, .fselect, .ftextarea { width: 100%; background: var(--s3); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 13px; padding: 8px 10px; outline: none; transition: border-color 0.15s; }
.finput:focus, .fselect:focus, .ftextarea:focus { border-color: var(--accent); }
.ftextarea { resize: vertical; min-height: 60px; }
.fselect option { background: var(--s3); }
.color-row { display: flex; gap: 6px; flex-wrap: wrap; }
.color-swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s; }
.color-swatch:hover { transform: scale(1.18); }
.color-swatch.selected { border-color: white; transform: scale(1.1); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.btn { border: none; border-radius: 7px; padding: 8px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
.btn:hover { opacity: 0.82; }
.btn-primary { background: var(--accent); color: #080808; font-weight: 600; }
.btn-ghost { background: var(--s3); color: var(--text-mid); }
.btn-danger { background: rgba(255,80,80,0.12); color: #ff6b6b; margin-right: auto; }
.btn-archive { background: rgba(200,255,87,0.08); color: var(--accent); }
.time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.subtask-select-list { display: flex; flex-direction: column; gap: 3px; max-height: 120px; overflow-y: auto; }
.subtask-opt { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); background: var(--s3); transition: border-color 0.12s; }
.subtask-opt.selected { border-color: var(--accent); }
.subtask-opt-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.subtask-opt-name { font-size: 11px; }
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
/* GİRİŞ EKRANI TASARIMI */
#authOverlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
}
.auth-card {
  background: var(--s1);
  padding: 40px;
  border-radius: 12px;
  border: 1px solid var(--border);
  text-align: center;
  width: 100%;
  max-width: 320px;
}
.auth-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: var(--accent);
  margin-bottom: 20px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.auth-input {
  width: 100%;
  background: var(--s3);
  border: 1px solid var(--border);
  padding: 12px;
  color: white;
  text-align: center;
  font-size: 18px;
  border-radius: 8px;
  margin-bottom: 15px;
  outline: none;
}
.auth-input:focus {
  border-color: var(--accent);
}
.auth-btn {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 12px;
  width: 100%;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
}
</style>
</head>
<body>
<div id="authOverlay">
  <div class="auth-card">
    <img src="logo.png" alt="Logo" style="width: 80px; height: 80px; margin-bottom: 20px; border-radius: 50%;">
    
    <div class="auth-title">SİSTEME GİRİŞ</div>
    <input type="password" id="passInput" class="auth-input" placeholder="Şifre Giriniz">
    <button class="auth-btn" onclick="checkMasterPassword()">GİRİŞ YAP</button>
  </div>
</div>
<div class="drag-ghost" id="dragGhost"></div>
<div class="select-bar" id="selectBar">
  <span id="selectBarText">0 saat seçili</span>
  <span>· sol panelden sürükle bırak</span>
  <span class="select-bar-clear" onclick="clearSelection()">✕</span>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <span class="logo">◈ planner</span>
  <div class="center-nav">
    <button class="nav-btn" onclick="changePeriod(-1)">‹</button>
    <span class="period-label" id="periodLabel"></span>
    <button class="nav-btn" onclick="changePeriod(1)">›</button>
    <button class="btn-today" onclick="goToday()">bugün</button>
    <div class="view-toggle">
      <button class="view-btn active" id="btnWeek" onclick="setView('week')">hafta</button>
      <button class="view-btn" id="btnMonth" onclick="setView('month')">ay</button>
    </div>
  </div>
  <button class="btn-new-task" onclick="openTaskModal()">+ Görev</button>
</div>

<div class="body">
  <div class="legend">
    <div class="legend-tabs">
      <button class="legend-tab active" id="tabActive" onclick="setLegendTab('active')">Aktif</button>
      <button class="legend-tab" id="tabArchive" onclick="setLegendTab('archive')">Arşiv</button>
    </div>
    <div class="legend-list" id="legendList"></div>
    <div class="legend-footer">
      <button class="btn btn-ghost" style="width:100%;font-size:11px" onclick="openTaskModal()">+ Yeni Görev</button>
    </div>
  </div>
  <div class="calendar-wrap" id="calendarWrap"></div>
</div>

<!-- TASK MODAL -->
<div class="overlay" id="taskOverlay" onclick="closeIfOutside(event,'taskOverlay')">
  <div class="modal">
    <div class="modal-title" id="taskModalTitle">Yeni Görev</div>
    <div class="fg"><label class="flabel">Başlık</label><input class="finput" id="taskTitle" placeholder="Görev adı..."></div>
    <div class="fg"><label class="flabel">Renk</label><div class="color-row" id="taskColorRow"></div></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="taskDeleteBtn" onclick="deleteTask()" style="display:none">Sil</button>
      <button class="btn btn-archive" id="taskArchiveBtn" onclick="toggleArchiveTask()" style="display:none">Arşivle</button>
      <button class="btn btn-ghost" onclick="closeOverlay('taskOverlay')">İptal</button>
      <button class="btn btn-primary" onclick="saveTask()">Kaydet</button>
    </div>
  </div>
</div>

<!-- SUBTASK MODAL -->
<div class="overlay" id="subtaskOverlay" onclick="closeIfOutside(event,'subtaskOverlay')">
  <div class="modal">
    <div class="modal-title" id="subtaskModalTitle">Alt Görev Ekle</div>
    <div class="fg"><label class="flabel">Başlık</label><input class="finput" id="subtaskTitle" placeholder="Alt görev adı..."></div>
    <div class="fg"><label class="flabel">Renk</label><div class="color-row" id="subtaskColorRow"></div></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="subtaskDeleteBtn" onclick="deleteSubtask()" style="display:none">Sil</button>
      <button class="btn btn-archive" id="subtaskArchiveBtn" onclick="toggleArchiveSubtask()" style="display:none">Arşivle</button>
      <button class="btn btn-ghost" onclick="closeOverlay('subtaskOverlay')">İptal</button>
      <button class="btn btn-primary" onclick="saveSubtask()">Kaydet</button>
    </div>
  </div>
</div>

<!-- BLOCK MODAL -->
<div class="overlay" id="blockOverlay" onclick="closeIfOutside(event,'blockOverlay')">
  <div class="modal">
    <div class="modal-title" id="blockModalTitle">Blok Ekle</div>
    <div class="fg"><label class="flabel">Görev</label><select class="fselect" id="blockTask" onchange="renderSubtaskSelect()"></select></div>
    <div class="fg"><label class="flabel">Alt Görev (opsiyonel)</label><div class="subtask-select-list" id="blockSubtaskList"></div></div>
    <div class="fg time-row">
      <div><label class="flabel">Başlangıç</label><input class="finput" type="time" id="blockStart"></div>
      <div><label class="flabel">Bitiş</label><input class="finput" type="time" id="blockEnd"></div>
    </div>
    <div class="fg"><label class="flabel">Not</label><textarea class="ftextarea" id="blockNotes" placeholder="Açıklama..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="blockDeleteBtn" onclick="deleteBlock()" style="display:none">Sil</button>
      <button class="btn btn-archive" id="blockArchiveBtn" onclick="archiveTaskFromBlock()" style="display:none">Arşivle</button>
      <button class="btn btn-ghost" onclick="closeOverlay('blockOverlay')">İptal</button>
      <button class="btn btn-primary" onclick="saveBlock()">Kaydet</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ŞİFRE KONTROLÜ
const MASTER_PASS = "31131231";

function checkMasterPassword() {
  const input = document.getElementById('passInput').value;
  if (input === MASTER_PASS) {
    document.getElementById('authOverlay').style.display = 'none';
    sessionStorage.setItem('isLoggedIn', 'true');
  } else {
    alert("Hatalı şifre!");
  }
}

// Sayfa yenilendiğinde tekrar sormasın istiyorsan (oturum boyu):
window.onload = function() {
  if (sessionStorage.getItem('isLoggedIn') === 'true') {
    document.getElementById('authOverlay').style.display = 'none';
  }
}

// Enter tuşuyla girişi sağla
document.addEventListener('keypress', function (e) {
  if (e.key === 'Enter' && document.getElementById('authOverlay').style.display !== 'none') {
    checkMasterPassword();
  }

// ── UTILS ──
function getWeekStart(d){const day=d.getDay(),diff=day===0?-6:1-day,s=new Date(d);s.setDate(d.getDate()+diff);s.setHours(0,0,0,0);return s;}
function addDays(d,n){const r=new Date(d);r.setDate(d.getDate()+n);return r;}
function toISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtWeek(ws){const we=addDays(ws,6);return `${ws.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})} – ${we.toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'})}`;}
function darken(hex,pct=0.62){const n=parseInt(hex.replace('#',''),16);const r=Math.max(0,(n>>16)-Math.round(255*pct));const g=Math.max(0,((n>>8)&255)-Math.round(255*pct));const b=Math.max(0,(n&255)-Math.round(255*pct));return `rgb(${r},${g},${b})`;}
// Local time ISO string üretir — timezone offset olmadan kaydeder
function toLocalISO(d){return `${toISO(d)}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;}
// Supabase'in UTC timestamp'lerini local time olarak parse eder (+3 kaymasını önler)
function parseTime(str){if(!str)return new Date();return new Date(str.replace(/(\+\d{2}:\d{2}|Z)$/,'').replace(' ','T'));}

// ── WEEKLY ──
function renderWeek(){
  const wrap=document.getElementById('calendarWrap');
  const today=toISO(new Date());
  const weekDates=Array.from({length:7},(_,i)=>addDays(weekStart,i));

  let html=`<div class="cal-head"><div class="cal-head-empty"></div>`;
  weekDates.forEach((d,i)=>{
    const iso=toISO(d);
    html+=`<div class="day-header${iso===today?' today':''}"><div class="day-name">${DAYS[i]}</div><div class="day-num">${d.getDate()}</div></div>`;
  });
  html+=`</div><div class="cal-body" id="calBody"><div class="cal-grid"><div class="time-col">`;
  for(let h=START_HOUR;h<END_HOUR;h++) html+=`<div class="time-slot"><span class="time-label">${String(h).padStart(2,'0')}</span></div>`;
  html+=`</div>`;
  weekDates.forEach(d=>{
    const iso=toISO(d);
    html+=`<div class="day-col" id="dc-${iso}">`;
    for(let h=START_HOUR;h<END_HOUR;h++){
      const sel=selectedCells.some(c=>c.iso===iso&&c.hour===h);
      html+=`<div class="hour-cell${sel?' selected':''}" id="cell-${iso}-${h}" data-hour-label="${String(h).padStart(2,'0')}:00" ondragover="onCellDragOver(event)" ondrop="onCellDrop(event,'${iso}',${h})" ondragleave="onCellDragLeave(event)" onclick="onCellClick(event,'${iso}',${h})"><div class="half-line"></div></div>`;
    }
    html+=`</div>`;
  });
  html+=`</div></div>`;
  wrap.innerHTML=html;
  renderBlocks();
  renderNowLine();
}

function renderBlocks(){
  document.querySelectorAll('.block').forEach(b=>b.remove());
  const weekDates=Array.from({length:7},(_,i)=>toISO(addDays(weekStart,i)));
  blocks.forEach(block=>{
    const start=parseTime(block.start_time),end=parseTime(block.end_time);
    const iso=toISO(start);
    if(!weekDates.includes(iso)) return;
    const col=document.getElementById(`dc-${iso}`);
    if(!col) return;
    const task=tasks.find(t=>t.id===block.task_id);
    if(!task) return;
    const sub=block.subtask_id?subtasks.find(s=>s.id===block.subtask_id):null;
    const startMin=start.getHours()*60+start.getMinutes();
    const endMin=end.getHours()*60+end.getMinutes();
    const sc=Math.max(startMin,START_HOUR*60),ec=Math.min(endMin,END_HOUR*60);
    if(ec<=sc) return;
    const top=((sc-START_HOUR*60)/60)*HOUR_H;
    const height=Math.max(((ec-sc)/60)*HOUR_H,18);
    const durMin=endMin-startMin;
    const dur=durMin>=60?`${Math.floor(durMin/60)}s${durMin%60>0?' '+durMin%60+'d':''}`:durMin+'d';
    const bg=darken(task.color);
    const isFaded=task.archived||(sub&&sub.archived);
    const el=document.createElement('div');
    el.className='block'+(isFaded?' faded':'');el.dataset.blockId=block.id;
    el.style.cssText=`top:${top}px;height:${height}px;background:${bg};`;
    el.draggable=true;
    const blockLabel=sub?`${task.title} / ${sub.title}`:task.title;
    el.innerHTML=`<div class="block-nodes"><div class="block-outer-node" style="color:${task.color}"></div></div><div class="block-title" style="color:${task.color}">${blockLabel}</div><div class="block-dur">${dur}</div>`;
    el.addEventListener('click',e=>{e.stopPropagation();openBlockModal(null,null,null,block.id);});
    el.addEventListener('dragstart',e=>onBlockDragStart(e,block.id));
    el.addEventListener('dragend',onBlockDragEnd);
    col.appendChild(el);
  });
}

function renderNowLine(){
  document.querySelectorAll('.now-line').forEach(e=>e.remove());
  const now=new Date(),iso=toISO(now),col=document.getElementById(`dc-${iso}`);
  if(!col) return;
  const min=now.getHours()*60+now.getMinutes();
  if(min<START_HOUR*60||min>END_HOUR*60) return;
  const top=((min-START_HOUR*60)/60)*HOUR_H;
  const line=document.createElement('div');line.className='now-line';line.style.top=top+'px';col.appendChild(line);
}

// ── MONTHLY ──
function renderMonth(){
  const wrap=document.getElementById('calendarWrap');
  const year=currentMonth.getFullYear(),month=currentMonth.getMonth();
  const today=toISO(new Date());
  const firstDay=new Date(year,month,1),lastDay=new Date(year,month+1,0);
  let startDow=firstDay.getDay();if(startDow===0)startDow=7;

  let html=`<div class="month-view"><div class="month-head">`;
  DAYS.forEach(d=>{html+=`<div class="month-day-name">${d}</div>`;});
  html+=`</div><div class="month-grid">`;

  const renderCell=(iso,num,other,isToday)=>{
    const dayBlocks=blocks.filter(b=>toISO(parseTime(b.start_time))===iso);
    const MAX=3;
    let bhtml=dayBlocks.slice(0,MAX).map(b=>{
      const t=tasks.find(x=>x.id===b.task_id);if(!t)return '';
      const sub=b.subtask_id?subtasks.find(s=>s.id===b.subtask_id):null;
      const label=sub?`${t.title} / ${sub.title}`:t.title;
      return `<div class="mc-block" style="background:${darken(t.color,0.55)};color:${t.color}" onclick="onMonthBlockClick(event,'${b.id}')">${label}</div>`;
    }).join('');
    if(dayBlocks.length>MAX) bhtml+=`<div class="mc-more">+${dayBlocks.length-MAX}</div>`;
    return `<div class="month-cell${other?' other-month':''}${isToday?' today':''}" onclick="onMonthCellClick('${iso}')"><div class="mc-num">${num}</div><div class="mc-blocks">${bhtml}</div></div>`;
  };

  for(let i=1;i<startDow;i++){const d=new Date(year,month,1-(startDow-i));html+=renderCell(toISO(d),d.getDate(),true,false);}
  for(let d=1;d<=lastDay.getDate();d++){const iso=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;html+=renderCell(iso,d,false,iso===today);}
  const used=(startDow-1)+lastDay.getDate();const rem=Math.ceil(used/7)*7-used;
  for(let i=1;i<=rem;i++){const d=new Date(year,month+1,i);html+=renderCell(toISO(d),d.getDate(),true,false);}
  html+=`</div></div>`;
  wrap.innerHTML=html;
}

function onCellClick(e,iso,hour){

    const idx=selectedCells.findIndex(c=>c.iso===iso&&c.hour===hour);
    if(idx>=0) selectedCells.splice(idx,1);else selectedCells.push({iso,hour});
    updateSelectBar();renderCellHighlights();return;
  }
  if(selectedCells.length>0){openBlockFromSelection(iso,hour);return;}
  openBlockModal(iso,null,hour,null);
}

function renderCellHighlights(){
  document.querySelectorAll('.hour-cell').forEach(el=>{
    const parts=el.id.split('-');const iso=parts.slice(1,4).join('-');const hour=parseInt(parts[4]);
    el.classList.toggle('selected',selectedCells.some(c=>c.iso===iso&&c.hour===hour));

function updateSelectBar(){
  const bar=document.getElementById('selectBar');
  if(selectedCells.length>0){bar.classList.add('visible');document.getElementById('selectBarText').textContent=`${selectedCells.length} saat seçili`;}
  else bar.classList.remove('visible');
}

function clearSelection(){selectedCells=[];updateSelectBar();renderCellHighlights();}

function openBlockFromSelection(iso,hour){
  const all=[...selectedCells];if(!all.find(c=>c.iso===iso&&c.hour===hour))all.push({iso,hour});
  const sorted=all.sort((a,b)=>a.iso===b.iso?a.hour-b.hour:a.iso.localeCompare(b.iso));
  const first=sorted[0],last=sorted[sorted.length-1];
  pendingBlockDate=first.iso;
  openBlockModal(first.iso,null,first.hour,null,null,null,last.hour+1);
  clearSelection();
}

// ── LEGEND DRAG ──
function onLegendDragStart(e,type,id,parentId=''){
  dragData={type:type==='task'?'legend-task':'legend-sub',id,parentId};
  e.dataTransfer.effectAllowed='copy';
  const task=type==='task'?tasks.find(t=>t.id===id):tasks.find(t=>t.id===parentId);
  const sub=type==='subtask'?subtasks.find(s=>s.id===id):null;
  const item=sub||task;if(!item)return;
  const g=document.getElementById('dragGhost');
  g.style.display='block';g.style.background=darken(item.color,0.5);g.style.color=item.color;
  g.textContent=item.title;
}

function onLegendDragEnd(){
  document.getElementById('dragGhost').style.display='none';
  dragData=null;
}

document.addEventListener('dragover',e=>{
  const g=document.getElementById('dragGhost');
  if(g.style.display==='block'){g.style.left=(e.clientX+14)+'px';g.style.top=(e.clientY+10)+'px';}
});

// ── BLOCK DRAG ──
function onBlockDragStart(e,blockId){
  dragData={type:'block',blockId};e.dataTransfer.effectAllowed='copyMove';
  const block=blocks.find(b=>b.id===blockId);
  if(block){const task=tasks.find(t=>t.id===block.task_id);if(task){const g=document.getElementById('dragGhost');g.style.display='block';g.style.background=darken(task.color,0.5);g.style.color=task.color;g.textContent=task.title;}}
  setTimeout(()=>e.target.classList.add('dragging'),0);
}
function onBlockDragEnd(e){
  e.target.classList.remove('dragging');dragData=null;
  document.getElementById('dragGhost').style.display='none';
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
}
function onCellDragOver(e){e.preventDefault();if(dragData?.type==='block')e.dataTransfer.dropEffect=shiftPressed?'copy':'move';e.currentTarget.classList.add('drag-over');}
function onCellDragLeave(e){e.currentTarget.classList.remove('drag-over');}

async function onCellDrop(e,iso,hour){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(!dragData) return;

  if(dragData.type==='block'){
    const block=blocks.find(b=>b.id===dragData.blockId);if(!block)return;
    const dur=parseTime(block.end_time)-parseTime(block.start_time);
    const newStart=new Date(`${iso}T${String(hour).padStart(2,'0')}:00:00`);
    const newEnd=new Date(newStart.getTime()+dur);
    const payload={start_time:toLocalISO(newStart),end_time:toLocalISO(newEnd)};
    if(shiftPressed){
      // Shift basılı → kopyala (orijinal kalır)
      const copy={...block,...payload,id:undefined};
      const {data}=await sb.from('blocks').insert(copy).select().single();
      if(data) blocks.push(data);
    } else {
      await sb.from('blocks').update(payload).eq('id',block.id);
      block.start_time=payload.start_time;block.end_time=payload.end_time;
    }
    renderBlocks();renderNowLine();

  } else if(dragData.type==='legend-task'||dragData.type==='legend-sub'){
    const taskId=dragData.type==='legend-task'?dragData.id:dragData.parentId;
    const subtaskId=dragData.type==='legend-sub'?dragData.id:null;
    let startHour=hour,endHour=hour+1;
    if(selectedCells.length>0){
      const same=selectedCells.filter(c=>c.iso===iso);
      if(same.length>0){const hours=same.map(c=>c.hour);startHour=Math.min(...hours);endHour=Math.max(...hours)+1;}
    }
    const start=new Date(`${iso}T${String(startHour).padStart(2,'0')}:00:00`);
    const end=new Date(`${iso}T${String(Math.min(endHour,23)).padStart(2,'0')}:00:00`);
    const payload={task_id:taskId,subtask_id:subtaskId||null,start_time:toLocalISO(start),end_time:toLocalISO(end),notes:null};
    const {data}=await sb.from('blocks').insert(payload).select().single();
    if(data) blocks.push(data);
    clearSelection();renderBlocks();renderNowLine();
  }
  dragData=null;
}

  document.getElementById('blockDeleteBtn').style.display=editId?'block':'none';
  const blockForArchive=editId?blocks.find(b=>b.id===editId):null;
  const archBtn=document.getElementById('blockArchiveBtn');
  archBtn.style.display=editId?'block':'none';
  if(blockForArchive){
    const isArchived=blockForArchive.subtask_id
      ?(subtasks.find(s=>s.id===blockForArchive.subtask_id)?.archived)
      :(tasks.find(t=>t.id===blockForArchive.task_id)?.archived);
    archBtn.textContent=isArchived?'Arşivden Çıkar':'Arşivle';
  }
  const sel=document.getElementById('blockTask');
  sel.innerHTML=tasks.filter(t=>!t.archived).map(t=>`<option value="${t.id}">${t.title}</option>`).join('');
  if(block){
    const s=parseTime(block.start_time),e=parseTime(block.end_time);
    sel.value=block.task_id;
    document.getElementById('blockStart').value=`${String(s.getHours()).padStart(2,'0')}:${String(s.getMinutes()).padStart(2,'0')}`;
    document.getElementById('blockEnd').value=`${String(e.getHours()).padStart(2,'0')}:${String(e.getMinutes()).padStart(2,'0')}`;
    document.getElementById('blockNotes').value=block.notes||'';
    pendingBlockDate=toISO(s);selectedBlockSubtaskId=block.subtask_id;
  } else {
    if(preTaskId)sel.value=preTaskId;
    const h=hour??9,eh=endHour??h+1;
    document.getElementById('blockStart').value=`${String(h).padStart(2,'0')}:00`;
    document.getElementById('blockEnd').value=`${String(Math.min(eh,23)).padStart(2,'0')}:00`;
    document.getElementById('blockNotes').value='';
    pendingBlockDate=iso;if(preSubId)selectedBlockSubtaskId=preSubId;
  }
  renderSubtaskSelect();openOverlay('blockOverlay');
}

function renderSubtaskSelect(){
  const taskId=document.getElementById('blockTask').value;
  const subs=subtasks.filter(s=>s.task_id===taskId);
  const el=document.getElementById('blockSubtaskList');
  if(!subs.length){el.innerHTML=`<div style="font-size:10px;color:var(--text-dim);padding:3px">Alt görev yok.</div>`;return;}
  el.innerHTML=subs.map(s=>`<div class="subtask-opt${selectedBlockSubtaskId===s.id?' selected':''}" onclick="selectBlockSub('${s.id}',this)"><div class="subtask-opt-dot" style="background:${s.color}"></div><span class="subtask-opt-name">${s.title}</span></div>`).join('');
}

function selectBlockSub(id,el){
  selectedBlockSubtaskId=selectedBlockSubtaskId===id?null:id;
  document.querySelectorAll('.subtask-opt').forEach(e=>e.classList.remove('selected'));
  if(selectedBlockSubtaskId)el.classList.add('selected');
}

async function saveBlock(){
  const taskId=document.getElementById('blockTask').value;if(!taskId)return;
  const sv=document.getElementById('blockStart').value,ev=document.getElementById('blockEnd').value;
  if(!sv||!ev)return;
  const dateStr=pendingBlockDate||toISO(new Date());
  const start=new Date(`${dateStr}T${sv}:00`),end=new Date(`${dateStr}T${ev}:00`);
  if(end<=start){alert('Bitiş başlangıçtan sonra olmalı');return;}
  const payload={task_id:taskId,subtask_id:selectedBlockSubtaskId||null,start_time:toLocalISO(start),end_time:toLocalISO(end),notes:document.getElementById('blockNotes').value.trim()||null};
  if(editingBlockId){
    await sb.from('blocks').update(payload).eq('id',editingBlockId);
    const idx=blocks.findIndex(b=>b.id===editingBlockId);if(idx>=0)blocks[idx]={...blocks[idx],...payload};
  } else {
    const {data}=await sb.from('blocks').insert(payload).select().single();if(data)blocks.push(data);
  }
  closeOverlay('blockOverlay');
  if(currentView==='week'){renderBlocks();renderNowLine();}else renderMonth();
}

async function deleteBlock(){
  if(!editingBlockId)return;
  await sb.from('blocks').delete().eq('id',editingBlockId);
  blocks=blocks.filter(b=>b.id!==editingBlockId);
  closeOverlay('blockOverlay');
  if(currentView==='week'){renderBlocks();renderNowLine();}else renderMonth();
}

async function archiveTaskFromBlock(){
  if(!editingBlockId)return;
  const block=blocks.find(b=>b.id===editingBlockId);if(!block)return;
  const subId=selectedBlockSubtaskId||block.subtask_id;
  if(subId){
    const s=subtasks.find(x=>x.id===subId);if(!s)return;
    const prev=s.archived;s.archived=!s.archived;
    const {error}=await sb.from('subtasks').update({archived:s.archived}).eq('id',s.id);
    if(error){s.archived=prev;alert('Hata: '+error.message);return;}
  } else {
    const t=tasks.find(x=>x.id===block.task_id);if(!t)return;
    const prev=t.archived;t.archived=!t.archived;
    const {error}=await sb.from('tasks').update({archived:t.archived}).eq('id',t.id);
    if(error){t.archived=prev;alert('Hata: '+error.message);return;}
    setLegendTab(t.archived?'archive':'active');
  }
  closeOverlay('blockOverlay');
  if(currentView==='week'){renderBlocks();renderNowLine();}else renderMonth();
}

// ── COLOR ROW ──
function renderColorRow(cid,sel){
  document.getElementById(cid).innerHTML=COLORS.map(c=>`<div class="color-swatch${c===sel?' selected':''}" style="background:${c}" data-color="${c}" onclick="selectColor('${cid}','${c}',this)"></div>`).join('');
}
function selectColor(cid,color,el){
  document.querySelectorAll(`#${cid} .color-swatch`).forEach(s=>s.classList.remove('selected'));el.classList.add('selected');
}

// ── OVERLAY ──
function openOverlay(id){document.getElementById(id).classList.add('open');}
function closeOverlay(id){document.getElementById(id).classList.remove('open');}
function closeIfOutside(e,id){if(e.target.id===id)closeOverlay(id);}

// ── KEYBOARD ──
document.addEventListener('keydown',e=>{
  if(e.key==='Shift') shiftPressed=true;
  if(e.key==='Escape'){['taskOverlay','subtaskOverlay','blockOverlay'].forEach(closeOverlay);clearSelection();}
});
document.addEventListener('keyup',e=>{if(e.key==='Shift') shiftPressed=false;});

// ── INIT ──
loadAll();
setInterval(renderNowLine,60000);
</script>
